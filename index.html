<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#cdd3d7" />
<meta name="description" content="Dream Unity — September 6." />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Dream Unity — September 6</title>
<style>
:root{
  color-scheme:light;
  --ink:#182027;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#c7ced2}
body{
  min-height:100dvh;
  overflow:hidden;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
.scene,.sky,.clouds,.ground,.veil,.vignette,.grain,.forms{position:fixed;inset:0;pointer-events:none}
.scene{
  z-index:0;
  background:
    radial-gradient(ellipse at 50% 67%, rgba(255,248,233,.95) 0 6%, rgba(246,244,236,.65) 13%, transparent 29%),
    radial-gradient(ellipse at 50% 34%, rgba(246,249,250,.72) 0 18%, transparent 50%),
    linear-gradient(180deg,#8d9aa3 0%,#aab5bc 22%,#c8d0d4 48%,#d7dcde 68%,#c5cccf 100%);
}
.sky{
  z-index:1;
  opacity:.95;
  background:
    radial-gradient(ellipse at 15% 18%,rgba(255,255,255,.56),transparent 30%),
    radial-gradient(ellipse at 82% 19%,rgba(229,234,237,.48),transparent 30%),
    radial-gradient(ellipse at 52% 10%,rgba(79,93,103,.20),transparent 42%),
    linear-gradient(90deg,rgba(36,49,58,.10),transparent 20% 80%,rgba(31,42,51,.12));
}
.clouds{
  z-index:2;
  inset:-12% -8% 20%;
  filter:blur(34px);
  opacity:.72;
  background:
    radial-gradient(ellipse at 10% 58%,rgba(247,249,249,.84) 0 13%,transparent 33%),
    radial-gradient(ellipse at 30% 66%,rgba(245,247,247,.72) 0 12%,transparent 32%),
    radial-gradient(ellipse at 60% 54%,rgba(241,244,245,.70) 0 15%,transparent 38%),
    radial-gradient(ellipse at 90% 64%,rgba(246,248,248,.84) 0 14%,transparent 34%),
    radial-gradient(ellipse at 44% 25%,rgba(81,93,102,.20) 0 15%,transparent 36%);
  animation:drift 22s ease-in-out infinite alternate;
}
.ground{
  z-index:2;
  top:auto;
  height:34vh;
  background:
    linear-gradient(180deg,rgba(223,227,228,.15),rgba(222,225,225,.75) 34%,rgba(205,210,211,.95) 100%),
    repeating-linear-gradient(0deg,rgba(65,74,80,.035) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(65,74,80,.028) 0 1px,transparent 1px 34px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}
.ground:before{
  content:"";
  position:absolute;
  left:50%;
  top:-20%;
  width:44vw;
  height:24vh;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(255,246,220,.58),transparent 67%);
  filter:blur(22px)
}
.forms{z-index:3}
.form{
  position:absolute;
  bottom:26vh;
  width:clamp(32px,4vw,72px);
  height:clamp(210px,38vh,430px);
  border-radius:52% 48% 50% 50%/46% 44% 56% 54%;
  background:linear-gradient(90deg,rgba(54,65,73,.92),rgba(83,94,101,.78) 46%,rgba(39,49,57,.92));
  box-shadow:inset 9px 0 13px rgba(255,255,255,.11),18px 20px 35px rgba(26,35,42,.17);
  filter:saturate(.65);
  opacity:.88
}
.form.a{left:10vw;transform:rotate(-2deg) scale(.96)}
.form.b{left:27vw;height:clamp(130px,24vh,260px);bottom:31vh;opacity:.57;transform:rotate(2deg)}
.form.c{right:12vw;height:clamp(170px,31vh,340px);bottom:29vh;opacity:.70;transform:rotate(1deg)}
.form:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-15px;
  width:110%;
  height:32px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(49,60,68,.30),transparent 65%);
  filter:blur(8px)
}
.veil{z-index:4;background:linear-gradient(180deg,rgba(236,240,242,.10),rgba(241,244,244,.36) 58%,rgba(236,239,239,.12));mix-blend-mode:screen}
.vignette{z-index:7;box-shadow:inset 0 0 18vw 3vw rgba(35,45,52,.30);background:linear-gradient(180deg,rgba(25,35,42,.10),transparent 22%,transparent 80%,rgba(50,58,64,.05))}
.grain{z-index:8;opacity:.045;mix-blend-mode:multiply;background-image:repeating-radial-gradient(circle at 30% 30%,rgba(24,30,34,.8) 0 .35px,transparent .45px 3px);background-size:7px 7px}
main{
  position:relative;
  z-index:6;
  min-height:100dvh;
  display:grid;
  grid-template-rows:1fr auto;
  align-items:center;
  padding:max(30px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))
}
.center{
  width:min(900px,92vw);
  margin:auto;
  text-align:center;
  transform:translateY(-5vh)
}
.caption{
  margin:0 auto 28px;
  max-width:850px;
  font-size:clamp(17px,1.55vw,23px);
  line-height:1.45;
  letter-spacing:.08em;
  font-weight:300;
  color:rgba(21,29,35,.76);
  text-shadow:0 1px 12px rgba(255,255,255,.25)
}
.counter{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:end;
  width:min(760px,90vw);
  margin:0 auto
}
.unit{position:relative;padding:0 14px}
.unit+.unit:before{
  content:"";
  position:absolute;
  left:0;
  top:18%;
  bottom:19%;
  width:1px;
  background:linear-gradient(180deg,transparent,rgba(27,35,40,.24),transparent)
}
.value{
  display:block;
  font-size:clamp(52px,6vw,78px);
  line-height:.92;
  font-weight:300;
  letter-spacing:.03em;
  font-variant-numeric:tabular-nums lining-nums;
  color:rgba(18,24,29,.86);
  text-shadow:0 1px 12px rgba(255,255,255,.28)
}
.label{
  display:block;
  margin-top:15px;
  font-size:clamp(10px,.82vw,12px);
  line-height:1;
  letter-spacing:.36em;
  text-transform:uppercase;
  color:rgba(26,34,39,.52);
  font-weight:400
}
.brand{
  align-self:end;
  margin:0 0 max(6px,env(safe-area-inset-bottom));
  text-align:center;
  font-size:clamp(28px,4.2vw,54px);
  line-height:1;
  letter-spacing:.62em;
  text-indent:.62em;
  text-transform:uppercase;
  font-weight:300;
  color:rgba(24,29,33,.83);
  text-shadow:0 1px 14px rgba(255,255,255,.26)
}
@keyframes drift{
  from{transform:translate3d(-1.5%,0,0) scale(1.03)}
  to{transform:translate3d(1.5%,-1%,0) scale(1.07)}
}
@media(max-width:700px){
  .center{transform:translateY(-2vh)}
  .caption{font-size:clamp(15px,4.2vw,18px);line-height:1.5;letter-spacing:.055em;margin-bottom:24px;max-width:88vw}
  .counter{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 0;width:min(430px,88vw)}
  .unit:nth-child(3):before{display:none}
  .unit:nth-child(-n+2):after{content:"";position:absolute;left:18%;right:18%;bottom:-9px;height:1px;background:linear-gradient(90deg,transparent,rgba(26,34,39,.16),transparent)}
  .value{font-size:clamp(48px,15vw,66px)}
  .label{font-size:10px;letter-spacing:.27em;margin-top:9px}
  .brand{font-size:clamp(24px,8vw,38px);letter-spacing:.34em;text-indent:.34em}
  .form.a{left:4vw;opacity:.58}
  .form.b{display:none}
  .form.c{right:4vw;opacity:.48}
}
@media(prefers-reduced-motion:reduce){.clouds{animation:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<div class="sky" aria-hidden="true"></div>
<div class="clouds" aria-hidden="true"></div>
<div class="ground" aria-hidden="true"></div>
<div class="forms" aria-hidden="true"><i class="form a"></i><i class="form b"></i><i class="form c"></i></div>
<div class="veil" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<main>
  <section class="center" aria-label="Time since September 6 began">
    <p class="caption">Time since we entered September 6 — Israel, IDT UTC+3 DST</p>
    <div class="counter" role="timer" aria-live="off">
      <div class="unit"><span id="days" class="value">00</span><span class="label">Days</span></div>
      <div class="unit"><span id="hours" class="value">00</span><span class="label">Hours</span></div>
      <div class="unit"><span id="minutes" class="value">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span id="seconds" class="value">00</span><span class="label">Seconds</span></div>
    </div>
  </section>
  <div class="brand">Dream Unity</div>
</main>
<script>
(() => {
  'use strict';
  const START = Date.parse('2026-09-05T21:00:00.000Z');
  const second = 1000;
  const minute = 60 * second;
  const hour = 60 * minute;
  const day = 24 * hour;
  const els = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds'),
    timer: document.querySelector('[role="timer"]')
  };
  const pad = n => String(n).padStart(2,'0');
  function tick(){
    const elapsed = Math.max(0, Date.now() - START);
    const d = Math.floor(elapsed / day);
    const h = Math.floor((elapsed % day) / hour);
    const m = Math.floor((elapsed % hour) / minute);
    const s = Math.floor((elapsed % minute) / second);
    els.days.textContent = pad(d);
    els.hours.textContent = pad(h);
    els.minutes.textContent = pad(m);
    els.seconds.textContent = pad(s);
    els.timer.setAttribute('aria-label', `${d} days, ${h} hours, ${m} minutes and ${s} seconds since September 6 began`);
    setTimeout(tick, Math.max(40, second - (Date.now() % second) + 8));
  }
  tick();
})();
</script>
</body>
</html>
