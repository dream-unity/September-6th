<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<meta name="description" content="Dream Unity — September 6." />

<title>Dream Unity — September 6</title>
<style>
:root{color-scheme:light;--ink:#263943;--muted:rgba(38,57,67,.56)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfd3de}
body{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.poster{position:fixed;inset:0;overflow:hidden;background:#d1e0e7}
.world{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette,.grain,.mist-top,.mist-bottom,.bluewash,.glint{position:absolute;inset:0;pointer-events:none}
.mist-top{background:linear-gradient(180deg,rgba(250,253,254,.30),transparent 41%)}
.mist-bottom{top:47%;animation:drift 24s ease-in-out infinite alternate;background:
 radial-gradient(ellipse at 16% 54%,rgba(252,254,254,.88) 0 11%,transparent 32%),
 radial-gradient(ellipse at 41% 61%,rgba(250,253,253,.95) 0 13%,transparent 34%),
 radial-gradient(ellipse at 69% 55%,rgba(251,253,254,.91) 0 12%,transparent 33%),
 radial-gradient(ellipse at 96% 64%,rgba(246,251,253,.91) 0 13%,transparent 34%);
 filter:blur(21px);opacity:.94;transform:scale(1.08)}
.bluewash{background:
 radial-gradient(ellipse at 15% 4%,rgba(105,145,166,.12),transparent 36%),
 radial-gradient(ellipse at 82% 6%,rgba(119,156,175,.10),transparent 37%),
 radial-gradient(ellipse at 52% -4%,rgba(135,171,189,.09),transparent 50%);
 mix-blend-mode:multiply;opacity:.30}
.grain{opacity:.026;mix-blend-mode:multiply;background-image:
 radial-gradient(circle at 22% 31%,rgba(67,91,104,.60) 0 .42px,transparent .54px),
 radial-gradient(circle at 69% 62%,rgba(255,255,255,.98) 0 .44px,transparent .56px);background-size:7px 7px,9px 9px}
.vignette{box-shadow:inset 0 0 10vw 2.5vw rgba(93,128,148,.10),inset 0 -8vh 11vh rgba(124,150,164,.04);background:linear-gradient(180deg,rgba(135,166,184,.04),transparent 25%,transparent 79%,rgba(235,243,246,.10))}
.glint{left:73%;top:68.1%;right:auto;bottom:auto;width:50px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,242,214,.84),transparent);box-shadow:0 0 11px rgba(255,242,214,.42);opacity:.34;animation:glint 7s ease-in-out infinite}
@keyframes drift{from{transform:translate3d(-1.2%,0,0) scale(1.08)}to{transform:translate3d(1.2%,-.5%,0) scale(1.1)}}
@keyframes glint{0%,100%{opacity:.18;transform:translateX(-9px)}50%{opacity:.56;transform:translateX(9px)}}
.content{position:absolute;z-index:4;left:50%;top:24%;width:min(970px,88vw);transform:translateX(-50%);text-align:center}
.caption{margin:0;color:rgba(34,52,62,.68);font-size:clamp(16px,1.45vw,25px);font-weight:300;letter-spacing:.13em;text-shadow:0 1px 0 rgba(255,255,255,.58)}
.counter{width:min(850px,95%);margin:clamp(25px,3.6vh,38px) auto 0;display:grid;grid-template-columns:repeat(4,1fr)}
.unit{position:relative;padding:0 clamp(8px,1.5vw,20px)}
.unit+.unit::before{content:"";position:absolute;left:0;top:10%;bottom:15%;width:1px;background:linear-gradient(180deg,transparent,rgba(60,88,102,.13),transparent)}
.value{display:block;font-size:clamp(56px,6.4vw,102px);font-weight:200;line-height:.90;letter-spacing:.035em;font-variant-numeric:tabular-nums lining-nums;color:rgba(29,44,53,.88);text-shadow:0 1px 0 rgba(255,255,255,.44)}
.label{display:block;margin-top:clamp(13px,1.8vh,20px);font-size:clamp(9px,.68vw,12px);font-weight:500;letter-spacing:.40em;text-transform:uppercase;color:rgba(48,71,83,.45)}
.brand{position:absolute;z-index:4;left:50%;bottom:7.8%;margin:0;transform:translateX(-50%);font-size:clamp(34px,4.7vw,74px);font-weight:300;letter-spacing:.50em;white-space:nowrap;text-transform:uppercase;color:rgba(31,47,56,.79);text-shadow:0 1px 0 rgba(255,255,255,.48)}
.brand span{display:inline-block;transform:translateX(.25em)}
@media(max-width:700px){.content{top:23%;width:95vw}.caption{font-size:clamp(14px,4vw,18px);letter-spacing:.08em}.counter{width:100%;margin-top:25px}.value{font-size:clamp(44px,14vw,70px)}.label{font-size:9px;letter-spacing:.22em}.unit{padding:0 5px}.brand{bottom:8%;font-size:clamp(28px,8vw,44px);letter-spacing:.30em}}
@media(max-height:620px){.content{top:18%}.brand{bottom:4.5%}}
@media(prefers-reduced-motion:reduce){.glint,.mist-bottom{animation:none}}
</style>
</head>

<main class="content" role="timer" aria-label="Time elapsed since September 6 began">
<p class="caption">Time since September 6 began — Israel, IDT UTC+3 DST</p>
<div class="counter" aria-hidden="true">
<div class="unit"><span class="value" id="days">00</span><span class="label">Days</span></div>
<div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div>
<div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div>
<div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div>
</div>
</main>
<h1 class="brand"><span>Dream Unity</span></h1>
<audio id="dreamUnitySoundtrack" autoplay loop preload="auto" playsinline aria-hidden="true">
  <source src="https://raw.githubusercontent.com/dream-unity/one/main/assets/audio/dream-maker-eye.mp3" type="audio/mpeg" />
</audio>
<script>
(()=>{const z=Date.parse('2026-09-05T21:00:00.000Z'),S=1e3,M=60*S,H=60*M,D=24*H,$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),timer=document.querySelector('[role="timer"]');function tick(){const e=Math.max(0,Date.now()-z),d=Math.floor(e/D),h=Math.floor(e%D/H),m=Math.floor(e%H/M),s=Math.floor(e%M/S);$('days').textContent=pad(d);$('hours').textContent=pad(h);$('minutes').textContent=pad(m);$('seconds').textContent=pad(s);timer.setAttribute('aria-label',`Time elapsed since September 6 began: ${d} days, ${h} hours, ${m} minutes and ${s} seconds`);setTimeout(tick,Math.max(40,S-(Date.now()%S)+8))}tick()})();
(()=>{
  const audio=document.getElementById('dreamUnitySoundtrack');
  if(!audio)return;
  audio.volume=1;
  const play=()=>{
    audio.muted=false;
    const attempt=audio.play();
    if(attempt&&typeof attempt.catch==='function')attempt.catch(()=>{});
  };
  play();
  window.addEventListener('load',play,{once:true});
  audio.addEventListener('canplay',play,{once:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audio.paused)play()});
  ['pointerdown','touchstart','keydown'].forEach(type=>window.addEventListener(type,play,{once:true,capture:true}));
})();
</script>
